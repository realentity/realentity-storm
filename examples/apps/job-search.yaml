# M30–M33: the Job Search App. Its pipelines say `app: Job Search`: a job-board pipeline (job-board:
# browser.extract with a recipe like recipes/example-jobs.yaml) keeps the jobs it finds as Jobs, the form steps move a job to prepared and
# applied, application-replies moves it on from the employer's emails. Save it
# on the Apps page before its pipelines, then press "Move them here" on its page to bring the jobs and applications
# the old Jobs page kept.
app:
  name: Job Search
  description: Jobs you find, and where you are with each
  icon: briefcase
  summary: >-
    New postings from a job board you choose, agencies set aside and the rest scored against what you
    look for, the best told to you; where you are with each, moved on by the employers' emails.
  setup:
    - { kind: recipe, name: jobs.example.com/search, label: "A job board's recipe, jobs.example.com/search (Recipes: import or teach)" }
    - { kind: llm, label: "The LLM, to score postings and read replies" }
    - { kind: telegram, label: "Telegram, for the best postings and the replies" }
    - { kind: email, label: "An email account, to read the employers' replies" }
types:
  Job:
    key: url                     # one Job per posting's address
    title: title
    stages:                      # where you are with each job; pipelines move it forward only, you move it as you like
      field: status
      initial: new
      states: [new, shortlisted, skipped, prepared, applied, responded, interview, offer, rejected]
      moves:
        - { from: new, to: [shortlisted, skipped], by: [me, pipeline] }
        - { from: [shortlisted, skipped], to: [new, shortlisted, skipped] }
        - { from: [new, shortlisted, skipped], to: [prepared, applied], by: [me, pipeline] }
        - { from: prepared, to: [applied], by: [me, pipeline] }
        - { from: prepared, to: [shortlisted, skipped] }
        - { from: applied, to: [responded, interview, rejected], by: [me, pipeline] }
        - { from: responded, to: [interview, rejected], by: [me, pipeline] }
        - { from: interview, to: [offer, rejected], by: [me, pipeline] }
        - { from: [applied, responded, interview, offer, rejected], to: [applied, responded, interview, offer, rejected] }   # a mistake undone
    fields:
      url: { type: url, required: true }
      title: { type: text, required: true }
      company: { type: text }
      location: { type: text }
      posted: { type: text }       # sites show "3 November" or "2 days ago": text until a recipe gives a date
      description: { type: longtext }
      score: { type: number }
      scoreReason: { type: longtext, label: Why }
      source: { type: text }
      externalId: { type: text }
      comments: { type: longtext, mine: true }    # mine: set on its page, never by a pipeline
pages:
  - list: Job
    menu: { label: Job Search }
    columns: [title, company, location, score, status, "@firstSeen"]
    filters: [status]
    sort: -score
    group: { by: status }
    moves: true
  - view: Job
    sections:
      - { title: Job, fields: [title, company, location, posted, url, source] }
      - { title: Score, fields: [score, scoreReason] }
      - { title: Description, fields: [description] }

pipelines:
  job-board:
    # Jobs from a job board, in the Job Search App: every weekday morning,
    # the board's categories read with a recipe (recipes/example-jobs.yaml: import it on the Recipes page as
    # "jobs.example.com/search", and set the site and the categories here), only the postings not kept before, the agencies
    # set aside as skipped, the rest scored against what you look for (edit `against`; `outcomes` learns from what came of
    # your applications) and kept as Jobs. You're told about the ones scored 70 or more. Nothing is sent.
    name: Job board
    description: New postings from a job board, scored and kept as Jobs; the best told on Telegram.
    trigger: { schedule: "0 8 * * 1-5" }
    policy:
      allowedDomains: [jobs.example.com]
    steps:
      - id: search
        type: browser.extract
        with:
          recipes: [jobs.example.com/search]
          params: { category: [back-end, full-stack] }
          maxItems: 300
      - id: fresh
        type: data.dedupe
        with: { from: "{{search.items}}", key: url, againstType: Job }
      - id: agencies
        type: llm.classify
        when: "{{fresh.items}}"
        with:
          items: "{{fresh.items}}"
          instruction: '"agency": a recruitment agency hiring for a client it doesn''t name. "employer": the company hires for itself.'
          labels: [employer, agency]
          keep: [employer]
      - id: score
        type: llm.score
        with:
          items: "{{agencies.kept}}"
          against: >-
            Senior or lead software engineer: back-end or full-stack, TypeScript or Node.js, remote or hybrid, a product
            company. Not: on-call heavy roles, short contracts.
          outcomes: true
      - id: save
        type: data.save
        with: { items: "{{score.scored}}", type: Job }
      - id: skipped
        type: data.save
        with: { items: "{{agencies.dropped}}", type: Job, stage: skipped }
      - id: best
        type: data.filter
        with: { items: "{{save.added}}", where: [{ field: score, op: gte, value: 70 }] }
      - id: tell
        type: notify.telegram
        forEach: "{{best.items}}"
        with: { text: "{{item.score}}: {{item.title}} at {{item.company}}, {{item.location}}.\n{{item.scoreReason}}\n{{item.url}}" }

  application-replies:
    # M16: every 15 minutes, emails about your applications move them on (replied, interview, rejected): the Jobs page
    # counts them, and a message tells you. Only forward: what you set by hand on the Jobs page stays unless an email moves it further.
    name: Application replies
    description: Replies about your applications update their status, and tell you.
    trigger: { schedule: "*/15 * * * *" }
    steps:
      - id: fetch
        type: email.fetch
        with: { mailbox: INBOX, limit: 50, sinceDays: 2 }
      - id: triage
        type: email.classify
        with:
          messages: "{{fetch.messages}}"
          instruction: >-
            "application": an employer or a recruiter writes about a job I applied for: an answer, a question, an
            interview, a rejection. "other": everything else, also job alerts, newsletters and an automatic "we received
            your application".
          labels: [application, other]
          keep: [application]
      - id: outcome
        type: application.outcome
        forEach: "{{triage.kept}}"
        with: { message: "{{item}}" }
      - id: tell
        type: notify.telegram
        forEach: "{{triage.kept}}"
        when: "{{outcome.changed}}"
        with:
          text: "{{outcome.job.company}} ({{outcome.job.title}}): {{outcome.status}}. {{outcome.reason}}\n{{outcome.job.url}}"
