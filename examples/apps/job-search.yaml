# M30–M33: the Job Search App. A job-board pipeline (job-board: browser.extract with a recipe like
# recipes/example-jobs.yaml) keeps the jobs it finds as Jobs, scored with what came of your earlier applications;
# application-replies moves a Job on from the employer's emails. You move a Job to prepared and applied on its page.
# M71: generic steps only: data.read gives the Jobs and when each reached its stages, llm.score and llm.extract read
# them, data.save moves a Job as its stages allow.
app:
  name: Job Search
  description: Jobs you find, and where you are with each
  icon: briefcase
  summary: >-
    New postings from a job board you choose, agencies set aside and the rest scored against what you
    look for, the best told to you; where you are with each, moved on by the employers' emails.
  setup:
    - { kind: recipe, name: jobs.example.com/search, label: "A job board's recipe, jobs.example.com/search (Recipes: import or teach)" }
    - { kind: llm, label: "The LLM, to score postings and read replies" }
    - { kind: telegram, label: "Telegram, for the best postings and the replies" }
    - { kind: email, label: "An email account, to read the employers' replies" }
types:
  Job:
    key: url                     # one Job per posting's address
    title: title
    stages:                      # where you are with each job; pipelines move it forward only, you move it as you like
      field: status
      initial: new
      states: [new, shortlisted, skipped, prepared, applied, responded, interview, offer, rejected]
      moves:
        - { from: new, to: [shortlisted, skipped], by: [me, pipeline] }
        - { from: [shortlisted, skipped], to: [new, shortlisted, skipped] }
        - { from: [new, shortlisted, skipped], to: [prepared, applied], by: [me, pipeline] }
        - { from: prepared, to: [applied], by: [me, pipeline] }
        - { from: prepared, to: [shortlisted, skipped] }
        - { from: applied, to: [responded, interview, rejected], by: [me, pipeline] }
        - { from: responded, to: [interview, rejected], by: [me, pipeline] }
        - { from: interview, to: [offer, rejected], by: [me, pipeline] }
        - { from: [applied, responded, interview, offer, rejected], to: [applied, responded, interview, offer, rejected] }   # a mistake undone
    fields:
      url: { type: url, required: true }
      title: { type: text, required: true }
      company: { type: text }
      location: { type: text }
      posted: { type: text }       # sites show "3 November" or "2 days ago": text until a recipe gives a date
      description: { type: longtext }
      score: { type: number }
      scoreReason: { type: longtext, label: Why }
      source: { type: text }
      externalId: { type: text }
      comments: { type: longtext, mine: true }    # mine: set on its page, never by a pipeline
pages:
  - list: Job
    menu: { label: Job Search }
    columns: [title, company, location, score, status, "@firstSeen"]
    filters: [status]
    sort: -score
    group: { by: status }
    moves: true
  - view: Job
    sections:
      - { title: Job, fields: [title, company, location, posted, url, source] }
      - { title: Score, fields: [score, scoreReason] }
      - { title: Description, fields: [description] }
  # The jobs found in a period and what came of them; by score band: do better scores get more replies and interviews?
  - report: Job
    menu: { label: Job report, icon: chart }
    periods: [90, 30, 365]
    tiles:
      - { label: Found, count: true }
      - { label: Shortlisted, reached: [shortlisted, prepared, applied] }
      - { label: Applied, reached: applied }
      - { label: Replied, reached: [responded, interview, offer, rejected], of: Applied }
      - { label: Interviews, reached: interview, of: Applied }
      - { label: Rejected, reached: rejected, of: Applied }
    trends:
      - { label: Found, count: true, every: week }
    tables:
      - { by: score, label: By score band, bands: [80, 60, 40, 0], columns: [Found, Applied, Replied, Interviews] }
      - { by: source, columns: [Found, Applied, Replied, Interviews] }

pipelines:
  job-board:
    # Jobs from a job board, in the Job Search App: every weekday morning,
    # the board's categories read with a recipe (recipes/example-jobs.yaml: import it on the Recipes page as
    # "jobs.example.com/search", and set the site and the categories here), only the postings not kept before, the agencies
    # set aside as skipped, the rest scored against what you look for (edit `against`; `examples` are your last
    # applications and what came of them: an interview, a rejection, an answer, or none in three weeks) and kept as
    # Jobs. You're told about the ones scored 70 or more. Nothing is sent.
    name: Job board
    description: New postings from a job board, scored and kept as Jobs; the best told on Telegram.
    trigger: { schedule: "0 8 * * 1-5" }
    policy:
      allowedDomains: [jobs.example.com]
    steps:
      - id: search
        type: browser.extract
        with:
          recipes: [jobs.example.com/search]
          params: { category: [back-end, full-stack] }
          maxItems: 300
      - id: fresh
        type: data.dedupe
        with: { from: "{{search.items}}", key: url, againstType: Job }
      - id: agencies
        type: llm.classify
        when: "{{fresh.items}}"
        with:
          items: "{{fresh.items}}"
          instruction: '"agency": a recruitment agency hiring for a client it doesn''t name. "employer": the company hires for itself.'
          labels: [employer, agency]
          keep: [employer]
      - id: past
        type: data.read
        when: "{{agencies.kept}}"
        with:
          type: Job
          where: [{ field: status, op: in, value: [applied, responded, interview, offer, rejected] }]
          sort: -@stages.applied
          limit: 100
          stageDates: true
      - id: outcomes
        type: data.map
        with:
          from: "{{past.items}}"
          # What came of each: an interview that ended in a rejection was still an interview; no answer counts after
          # three weeks. The last 30.
          expression: |-
            (
              $silent := $fromMillis($millis() - 21 * 86400000);
              $done := $filter($, function($j) { $j.status != "applied" or $lookup($j, "@stages").applied < $silent });
              $map($done, function($j) {(
                $d := $lookup($j, "@stages");
                {
                  "title": $j.title,
                  "company": $j.company,
                  "location": $j.location,
                  "scoredThen": $j.score,
                  "outcome": $d.offer ? "offer" : $d.interview ? "interview" : $d.rejected ? "rejected" : $d.responded ? "answered" : "no answer in 3 weeks"
                }
              )})[[0..29]]
            )
      - id: score
        type: llm.score
        with:
          items: "{{agencies.kept}}"
          against: >-
            Senior or lead software engineer: back-end or full-stack, TypeScript or Node.js, remote or hybrid, a product
            company. Not: on-call heavy roles, short contracts.
          examples: "{{outcomes.items}}"
      - id: save
        type: data.save
        with: { items: "{{score.scored}}", type: Job }
      - id: skipped
        type: data.save
        with: { items: "{{agencies.dropped}}", type: Job, stage: skipped }
      - id: best
        type: data.filter
        with: { items: "{{save.added}}", where: [{ field: score, op: gte, value: 70 }] }
      - id: tell
        type: notify.telegram
        forEach: "{{best.items}}"
        with: { text: "{{item.score}}: {{item.title}} at {{item.company}}, {{item.location}}.\n{{item.scoreReason}}\n{{item.url}}" }

  application-replies:
    # M16; M71 on generic steps: every 15 minutes, emails about your open applications move their Jobs on (responded,
    # interview, rejected), and a message tells you. Only forward, as the Job's stages allow: what you set by hand
    # stays unless an email moves it further. No open application, no email read.
    name: Application replies
    description: Replies about your applications move their Jobs on, and tell you.
    trigger: { schedule: "*/15 * * * *" }
    steps:
      - id: open
        type: data.read
        with:
          type: Job
          where: [{ field: status, op: in, value: [applied, responded, interview] }]
          sort: -@stages.applied
          limit: 30
          stageDates: true
      - id: fetch
        type: email.fetch
        when: "{{open.items}}"
        with: { mailbox: INBOX, limit: 50, sinceDays: 2 }
      - id: triage
        type: email.classify
        when: "{{fetch.messages}}"
        with:
          messages: "{{fetch.messages}}"
          instruction: >-
            "application": an employer or a recruiter writes about a job I applied for: an answer, a question, an
            interview, a rejection. "other": everything else, also job alerts, newsletters and an automatic "we received
            your application".
          labels: [application, other]
          keep: [application]
      - id: applications
        type: data.map
        with:
          from: "{{open.items}}"
          expression: |-
            $map($, function($j) { { "url": $j.url, "title": $j.title, "company": $j.company, "status": $j.status } })
      - id: read
        type: llm.extract
        forEach: "{{triage.kept}}"
        with:
          content: { email: "{{item}}", applications: "{{applications.items}}" }
          instruction: >-
            The content is an email I received and my open job applications. Decide which application the email is
            about, by the company (the sender's domain, the company's name) and the role, and what it says: interview
            (they invite me to an interview or a call, or schedule one), rejected (they won't go on with me), responded
            (a person from the employer or its recruiter answered otherwise: a question, next steps, an assignment),
            none (not about these applications, or only an automatic confirmation that my application arrived).
          fields:
            job: "the url of the application the email is about, exactly as in applications; empty when none fits or you're unsure"
            outcome: "interview, rejected, responded or none"
            reason: "what the email says, in one sentence"
      - id: moves
        type: data.map
        with:
          from: { jobs: "{{open.items}}", read: "{{read.values}}" }
          # The Job the email is about, moved to what it says; comments are mine, so they aren't given back.
          expression: |-
            (
              $all := $;
              $map(read, function($v) {(
                $outcome := $lowercase($trim($string($v.outcome)));
                $job := $all.jobs[url = $trim($string($v.job))][0];
                $job and $outcome in ["responded", "interview", "rejected"] ?
                  $merge([$sift($job, function($x, $k) { $k != "comments" }), { "status": $outcome, "@reason": $v.reason }])
                  : undefined
              )})
            )
      - id: save
        type: data.save
        with: { items: "{{moves.items}}", type: Job }
      - id: news
        type: data.map
        with:
          from: { changed: "{{save.changed}}", moves: "{{moves.items}}" }
          expression: |-
            (
              $all := $;
              $map(changed[after.status], function($c) {(
                $why := $lookup($all.moves[url = $c.key][0], "@reason");
                { "text": $c.item.company & " (" & $c.item.title & "): " & $c.after.status & ". " & $why & "\n" & $c.key }
              )})
            )
      - id: tell
        type: notify.telegram
        forEach: "{{news.items}}"
        with: { text: "{{item.text}}" }
