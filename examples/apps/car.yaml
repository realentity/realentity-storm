# The Car App: your vehicles and the papers and services that run out, all added by you (mine): insurance, the
# technical inspection, the vignette, the tax, a service due at a date or a mileage. The list shows what is due soon;
# car-papers-due tells you once a month before and once a week before, and once when you renew it (a later date);
# paper-in-calendar puts each expiry date in your calendar.
app:
  name: Car
  description: Your car's papers and services, and when they run out
  icon: car
  summary: >-
    Your car's insurance, inspection, vignette, tax and services, added by you, with what runs out soon
    on the list, a message a month and a week before (or 1 000 km before a service), and each date in
    your calendar. No LLM.
  setup:
    - { kind: entities, type: Paper, label: "Your car's papers, added on its page" }
    - { kind: telegram, label: "Telegram, to tell you what runs out" }
    - { kind: google-calendar, label: "Google Calendar, for the dates" }
types:
  Vehicle:
    mine: true
    key: name
    fields:
      name: { type: text, required: true }        # "Family car"
      plate: { type: text }
      model: { type: text }
      year: { type: number }
      mileage: { type: number, label: km }        # update it now and then: a service due at a mileage reads it
      notes: { type: longtext }
  Paper:
    mine: true
    key: name
    fields:
      name: { type: text, required: true }        # "Family car insurance"
      vehicle: { type: text }                     # the Vehicle's name
      kind: { type: enum, values: [insurance, inspection, vignette, tax, registration, licence, service, other] }
      expires: { type: date, label: Until }       # renewed: move it on; the reminders start over
      dueKm: { type: number, label: Due at km }   # a service due at a mileage
      cost: { type: money, currency: currency }
      currency: { type: text }
      provider: { type: text }
      notes: { type: longtext }
pages:
  - list: Paper
    menu: { label: Car papers, icon: car }
    columns: [name, kind, { field: expires, due: { days: 30 } }, dueKm, cost, provider]
    filters: [kind]
    sort: expires
    group: { by: vehicle, totals: [cost] }
  - view: Paper
    sections:
      - { title: Paper, fields: [vehicle, kind, expires, dueKm, cost, provider, notes] }
  - list: Vehicle
    menu: { label: Vehicles, icon: car }
    columns: [name, plate, model, year, mileage]

pipelines:
  car-papers-due:
    # Every morning, the papers of the Car App against today and your vehicles'
    # mileage: told once when one has 30 days left, once more at 7, once when a service is 1 000 km away, and once when you
    # renew it (move its date on, or its mileage). data.alert remembers what it told, so it is one message each, not one a
    # day. No LLM.
    name: Papers due
    description: Tells you when a car paper or service runs out soon, and when it's renewed.
    trigger: { schedule: "0 8 * * *" }
    steps:
      - id: papers
        type: data.read
        with: { type: Paper, limit: 200 }
      - id: vehicles
        type: data.read
        with: { type: Vehicle, limit: 50 }
      - id: left
        type: data.map
        with:
          from: { papers: "{{papers.items}}", vehicles: "{{vehicles.items}}" }
          # Each paper with the days left until it runs out, and the km left until a service due at a mileage.
          expression: |-
            (
              $t := $toMillis($now());
              $vehicles := vehicles;
              papers.(
                $p := $;
                $v := $vehicles[name = $p.vehicle][0];
                {
                  "name": name,
                  "label": vehicle ? name & " (" & vehicle & ")" : name,
                  "expires": expires,
                  "daysLeft": expires ? $floor(($toMillis(expires) - $t) / (24 * 60 * 60 * 1000)),
                  "dueKm": dueKm,
                  "kmLeft": dueKm and $v.mileage ? dueKm - $v.mileage
                }
              )
            )
      - id: month
        type: data.alert
        with: { items: "{{left.items}}", key: name, value: daysLeft, below: 31, label: label }
      - id: week
        type: data.alert
        with: { items: "{{left.items}}", key: name, value: daysLeft, below: 8, label: label }
      - id: km
        type: data.alert
        with: { items: "{{left.items}}", key: name, value: kmLeft, below: 1000, label: label }
      - id: soon
        type: notify.telegram
        forEach: "{{month.crossed}}"
        with: { text: "{{item.label}} runs out on {{item.expires}}: {{item.daysLeft}} days left." }
      - id: urgent
        type: notify.telegram
        forEach: "{{week.crossed}}"
        with: { text: "Only {{item.daysLeft}} days left: {{item.label}} runs out on {{item.expires}}." }
      - id: service
        type: notify.telegram
        forEach: "{{km.crossed}}"
        with: { text: "{{item.label}} is due at {{item.dueKm}} km: {{item.kmLeft}} km to go." }
      - id: renewed
        type: notify.telegram
        forEach: "{{month.cleared}}"
        with: { text: "{{item.label}} renewed: now until {{item.expires}}." }

  paper-in-calendar:
    # When you add a car Paper in the Car App or move its date: the day it runs out in your calendar, at 09:00, after you
    # Act at its gate. A date already past does nothing; an event already there (the same title at the same time) isn't
    # made again.
    name: Paper in calendar
    description: A car paper's expiry date goes into your calendar.
    trigger: { on: entity.changed, type: Paper, field: expires }
    steps:
      - id: ahead
        type: data.map
        with:
          from: "{{trigger.item}}"
          expression: 'expires and $toMillis(expires) + 24 * 60 * 60 * 1000 > $toMillis($now()) ? { "start": expires & "T09:00" }'
      - id: event
        type: calendar.create
        forEach: "{{ahead.items}}"
        with:
          title: "Runs out: {{trigger.item.name}}"
          start: "{{item.start}}"
          durationMinutes: 30
          description: "{{trigger.item.kind}} {{trigger.item.provider}}"
