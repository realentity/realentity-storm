# M33: the Bills App. bill.save (bills) keeps each bill read from email as a Bill, due until you mark
# it paid; the morning brief tells you the unpaid ones due soon. Save it on the Apps page before bills,
# then press "Move my bills here" on its page to bring the bills the old Bills page kept.
app:
  name: Bills
  description: Bills from email, by month, paid or not
  icon: receipt
  summary: >-
    Bills read from your email, by month, due until you mark them paid, with a reminder in your
    calendar.
  setup:
    - { kind: email, label: "An email account, to read the bills from" }
    - { kind: llm, label: "The LLM, to read each bill" }
    - { kind: google-calendar, label: "Google Calendar, for the reminders" }
    - { kind: telegram, label: "Telegram, to tell you about new bills" }
types:
  Bill:
    key: billKey                 # the sender's domain with the bill's reference, period or due date: the same bill again is the same Bill
    title: issuer
    stages:
      field: status
      initial: due
      states: [due, paid]
      moves:
        - { from: due, to: [paid] }
        - { from: paid, to: [due] }
    fields:
      billKey: { type: text, required: true, label: Bill }
      issuer: { type: text, required: true }
      issuerKey: { type: text, label: Sender }
      amount: { type: money, required: true, currency: currency }
      currency: { type: text }
      dueDate: { type: date, label: Due }
      month: { type: date }        # the month it is for (its first day): the period, else the due date's, else when it came
      period: { type: text }
      reference: { type: text }
      from: { type: email }
      subject: { type: text }
      messageId: { type: text }
pages:
  - list: Bill
    menu: { label: Bills, icon: receipt }
    columns: [issuer, amount, { field: dueDate, due: { days: 3, unless: { status: paid } } }, reference, status]
    filters: [status]
    sort: dueDate
    group: { by: month, period: month, totals: [amount, { field: amount, label: Unpaid, when: { status: due } }] }
    moves: true
  - view: Bill
    sections:
      - { title: Bill, fields: [issuer, amount, dueDate, period, reference] }
      - { title: Email, fields: [from, subject] }

pipelines:
  bills:
    # M23: bills from email (the text or a PDF): kept in the Bills App (M33, this App: save it first), a
    # calendar reminder 3 days before each is due (after Act at the gate, like every event), and a message when one is much
    # higher than usual. Nothing is paid.
    name: Read bills
    description: Bills from email, kept with a reminder before they're due.
    trigger: { schedule: "0 8,18 * * *" }
    steps:
      - id: fetch
        type: email.fetch
        with: { sinceDays: 7 }
      - id: triage
        type: email.classify
        with:
          messages: "{{fetch.messages}}"
          instruction: "bill: an invoice, a utility or phone bill, or a payment request with an amount for me to pay"
      - id: read
        type: bill.read
        when: "{{triage.kept}}"
        with: { messages: "{{triage.kept}}" }
      - id: save
        type: bill.save
        with: { bills: "{{read.bills}}", remindDaysBefore: 3, jumpPercent: 30 }
      - id: remind
        type: calendar.create
        forEach: "{{save.remind}}"
        with:
          title: "{{item.title}}"
          start: "{{item.remindAt}}"
          durationMinutes: 15
          description: "{{item.subject}}"
      - id: jump
        type: notify.telegram
        when: "{{save.jumpText}}"
        with: { text: "{{save.jumpText}}" }
