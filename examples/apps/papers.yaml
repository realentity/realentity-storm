# M48: the Papers App: receipts, invoices, warranties and contracts, each with its photo or PDF. Add one on its list
# with its document: read-paper reads it and fills in what it says (what it is, the merchant, the amount, the
# dates, a category, a contract's end and notice); what you typed stays over what it read. warranty-in-calendar puts a
# warranty's end in your calendar, after you Act. A paper's key is made by Storm.
# M58-T1: a claim under warranty (warranty-claim) and a contract's cancellation (contract-cancel), each on its button,
# go to the Merchant you set on the paper (Write to): an address you wrote, never one read from a paper. A contract
# is told on Telegram before its notice runs out (contract-watch, contract-reminder). On the 1st, last month's
# receipts and invoices go to your accountant (expense-report), the ones you pick, after you Act.
# M59-T1: the claim attaches the paper's document, the expense report each paper's.
# M66: with a Bills App (uses: Bill, optional), the expense report lists last month's bills too.
app:
  name: Papers
  description: Receipts, invoices, warranties and contracts, read for you, with their dates
  icon: receipt
  summary: >-
    Receipts, invoices, warranties and contracts with their photo or PDF, read for you: the merchant, the
    amount and the dates. A warranty's end in your calendar, a claim with its receipt on a button; a reminder
    before a contract's notice runs out; last month's expenses and documents to your accountant.
  setup:
    - { kind: llm, label: "The LLM, to read the papers" }
    - { kind: google-calendar, label: "Google Calendar, for warranties" }
    - { kind: email, label: "An email account, for claims, cancellations and the expense report" }
    - { kind: telegram, label: "Telegram, for contracts ending" }
types:
  Paper:
    key: id
    title: title
    fields:
      id: { type: text, auto: true }
      title: { type: text, required: true }
      document: { type: file }                  # a photo or a PDF
      kind: { type: enum, values: [receipt, invoice, warranty, contract, other] }
      merchant: { type: text }
      amount: { type: money, currency: currency }
      currency: { type: text }
      date: { type: date }
      category: { type: enum, values: [office, equipment, software, travel, meals, services, personal, other] }
      warrantyUntil: { type: date, label: Warranty until }
      endsOn: { type: date, label: Ends, when: { kind: contract } }
      noticeDays: { type: number, label: Notice (days), when: { kind: contract }, help: "How many days before its end it must be cancelled" }
      seller: { type: ref, to: Merchant, mine: true, label: Write to, help: "The merchant claims and cancellations go to" }
      notes: { type: longtext }
  Merchant:
    mine: true                     # you add them: their address is the only one Papers writes to
    key: name
    fields:
      name: { type: text, required: true }
      email: { type: email, required: true }
      notes: { type: longtext }
pages:
  - list: Paper
    menu: { label: Papers, icon: receipt }
    add: true
    columns: [document, title, kind, merchant, amount, date, { field: warrantyUntil, due: { days: 30 } }, { field: endsOn, due: { days: 60 } }]
    filters: [kind, category]
    search: [title, merchant, notes]
    sort: -date
    actions:
      - { label: Expense report, run: expense-report, confirm: "Make last month's expense report? You pick the papers and see the email before it goes." }
  - view: Paper
    sections:
      - { title: Paper, fields: [kind, merchant, amount, date, category, warrantyUntil, endsOn, noticeDays, seller, notes] }
      - { title: Document, fields: [document] }
    actions:
      - { label: Claim warranty, run: warranty-claim, when: { kind: [receipt, warranty] }, confirm: "Draft a warranty claim to this paper's merchant? You see it before it goes." }
      - { label: Cancel contract, run: contract-cancel, when: { kind: contract }, confirm: "Draft a cancellation of this contract to its merchant? You see it before it goes." }
  - form: Paper
    fields: [title, document, kind, merchant, amount, currency, date, category, warrantyUntil, endsOn, noticeDays, seller, notes]
  - list: Merchant
    menu: { label: Merchants, icon: tag }
    add: true
    columns: [name, email]
    search: [name, email, notes]
  - form: Merchant
    fields: [name, email, notes]
# M66: your bills, from your Bills App when you have one: the expense report lists the month's bills too. Papers works
# without it; choose which App they come from on Papers' page.
uses:
  Bill:
    from: { app: Bills, type: Bill }
    fields: [issuer, amount, currency, dueDate, month, status]
    help: Your bills, listed in the monthly expense report with the receipts and invoices
    optional: true

pipelines:
  read-paper:
    # When you add a paper in the Papers App or change its document: the LLM
    # reads the photo or PDF and fills in what it is, the merchant, the amount and the dates. What you typed yourself stays
    # over what it read; what it can't read is left empty. The document is data, never instructions.
    name: Read a paper
    description: Reads a paper's photo or PDF and fills in its merchant, amount and dates.
    trigger: { on: entity.changed, type: Paper, field: document }
    steps:
      - id: read
        type: llm.extract
        when: "{{trigger.item.document}}"
        with:
          files: ["{{trigger.item.document}}"]
          fields:
            kind: "what it is: receipt, invoice, warranty, contract or other"
            merchant: the shop or company that issued it
            amount: the total paid or to pay, as a number
            currency: the currency, as its code (EUR, BGN, USD)
            date: the date it was issued
            category: "what it was for: office, equipment, software, travel, meals, services, personal or other"
            warrantyUntil: when its warranty ends; a period (2 years) counted from its date
            endsOn: a contract's end date, or the date it renews if it renews by itself
            noticeDays: a contract's notice to cancel it, in days (a month is 30)
      - id: save
        type: data.save
        with:
          type: Paper
          items:
            - id: "{{trigger.item.id}}"
              kind: "{{read.values.kind}}"
              merchant: "{{read.values.merchant}}"
              amount: "{{read.values.amount}}"
              currency: "{{read.values.currency}}"
              date: "{{read.values.date}}"
              category: "{{read.values.category}}"
              warrantyUntil: "{{read.values.warrantyUntil}}"
              endsOn: "{{read.values.endsOn}}"
              noticeDays: "{{read.values.noticeDays}}"

  warranty-in-calendar:
    # When a paper of the Papers App gets a warranty end (typed, or read by read-paper): that day in your calendar,
    # at 09:00, after you Act at its gate. A date already past does nothing.
    name: Warranty in calendar
    description: A warranty's end goes into your calendar.
    trigger: { on: entity.changed, type: Paper, field: warrantyUntil }
    steps:
      - id: ahead
        type: data.map
        with:
          from: "{{trigger.item}}"
          expression: 'warrantyUntil and $toMillis(warrantyUntil) + 24 * 60 * 60 * 1000 > $toMillis($now()) ? { "start": warrantyUntil & "T09:00" }'
      - id: event
        type: calendar.create
        forEach: "{{ahead.items}}"
        with:
          title: "Warranty ends: {{trigger.item.title}}"
          start: "{{item.start}}"
          durationMinutes: 30
          description: "{{trigger.item.merchant}}"

  paper-from-telegram:
    # A photo or a PDF sent to the Storm bot with /paper and its title as the caption becomes a paper in the Papers App
    #; read-paper then reads it and fills in the merchant, the amount and
    # the dates. Switch it on to have /paper in the bot's menu.
    name: From Telegram
    description: A photo or PDF sent with /paper on Telegram becomes a paper, read for you.
    trigger: { on: telegram.command, command: paper, description: "Keep a receipt or warranty: a photo or PDF with /paper and its title as the caption" }
    steps:
      - id: keep
        type: file.keep
        with: { type: Paper, field: document, telegram: "{{trigger.file}}" }
      - id: paper
        type: data.map
        with:
          from: { text: "{{trigger.text}}", sentAt: "{{trigger.sentAt}}", document: "{{keep.first}}" }
          expression: 'document ? { "title": $trim(text) ? $substring($trim(text), 0, 120) : "Paper of " & $substring(sentAt, 0, 10), "document": document }'
      - id: save
        type: data.save
        with: { type: Paper, items: "{{paper.items}}" }
      - id: kept
        type: notify.telegram
        when: "{{save.added}}"
        with: { text: "Kept: {{paper.value.title}}. Reading it now." }
      - id: nothing
        type: notify.telegram
        when: "{{keep.skipped}}"
        with: { text: "Not kept: send a photo or a PDF, with /paper and its title as the caption." }
      # /paper with no photo or file at all (typed as a message, or the file sent apart from it): said too, not a quiet run.
      - id: noFile
        type: data.map
        with:
          from: { document: "{{keep.first}}", skipped: "{{keep.skipped}}" }
          expression: '(document or $count(skipped) > 0) ? "" : "missing"'
      - id: noFileSaid
        type: notify.telegram
        when: "{{noFile.value}}"
        with: { text: "Nothing kept: /paper needs a photo or a PDF with it. Attach the file and write /paper and its title as its caption, in the same message." }

  warranty-claim:
    # From a receipt's or warranty's button in the Papers App: a claim under its warranty, sent to the Merchant you set
    # on it (Write to) after you Act at the gate, where you edit it: what is wrong comes from its notes, or is left for
    # you to fill in. A paper without a Merchant sends nothing and says so. The paper's document (the receipt) goes
    # with it, shown at the gate.
    name: Warranty claim
    description: A claim under a paper's warranty, to its merchant, sent after you approve it.
    trigger: { on: entity.action, type: Paper }
    limits:
      email.send: 10/day
    steps:
      - id: merchants
        type: data.read
        with: { type: Merchant, where: [{ field: name, op: eq, value: "{{trigger.item.seller}}" }], limit: 1 }
      - id: draft
        type: llm.generate
        forEach: "{{merchants.items}}"
        with:
          instruction: >-
            A short, polite warranty claim to the merchant, in the language of their name and notes (English when
            unsure): what I bought (the paper's title) and when, what I paid, that it is under warranty until its date,
            and what is wrong, from the paper's notes; when the notes don't say, write the line "[What is wrong]" for me
            to fill in. Ask whether they repair or replace it and how to send it. Say the receipt is attached when
            the paper has a document. No subject line, no other text.
          context: { paper: "{{trigger.item}}", merchant: "{{item}}" }
      - id: send
        type: email.send
        forEach: "{{merchants.items}}"
        with:
          to: "{{item.email}}"
          subject: "Warranty claim: {{trigger.item.title}}"
          body: "{{draft.text}}"
          # M59-T1: the receipt; a paper without a document sends the claim alone.
          attachments: "{{trigger.item.document}}"
      - id: nobody
        type: data.map
        with:
          from: { found: "{{merchants.count}}" }
          expression: 'found = 0 ? "missing"'
      - id: said
        type: notify.telegram
        when: "{{nobody.value}}"
        with: { text: "No claim for {{trigger.item.title}}: choose who to write to (Write to) on its page, adding the merchant under Merchants." }

  contract-cancel:
    # From a contract's button in the Papers App: a notice cancelling it at its end, sent to the Merchant you set on it
    # (Write to) after you Act at the gate, where you edit it. A contract without a Merchant sends nothing and says so.
    name: Cancel contract
    description: A contract's cancellation, to its merchant, sent after you approve it.
    trigger: { on: entity.action, type: Paper }
    limits:
      email.send: 10/day
    steps:
      - id: merchants
        type: data.read
        with: { type: Merchant, where: [{ field: name, op: eq, value: "{{trigger.item.seller}}" }], limit: 1 }
      - id: draft
        type: llm.generate
        forEach: "{{merchants.items}}"
        with:
          instruction: >-
            A short, formal notice cancelling this contract, in the language of the merchant's name and notes (English
            when unsure): which contract (its title, its date, a number from its notes), that I cancel it as of its end
            date, or the first date its notice allows, and that I ask them to confirm it in writing. No subject line,
            no other text.
          context: { contract: "{{trigger.item}}", merchant: "{{item}}" }
      - id: send
        type: email.send
        forEach: "{{merchants.items}}"
        with:
          to: "{{item.email}}"
          subject: "Cancellation: {{trigger.item.title}}"
          body: "{{draft.text}}"
      - id: nobody
        type: data.map
        with:
          from: { found: "{{merchants.count}}" }
          expression: 'found = 0 ? "missing"'
      - id: said
        type: notify.telegram
        when: "{{nobody.value}}"
        with: { text: "No cancellation for {{trigger.item.title}}: choose who to write to (Write to) on its page, adding the merchant under Merchants." }

  contract-watch:
    # When a paper of the Papers App changes: a contract with an end date gets a reminder (contract-reminder) at 09:00
    # two weeks before its notice runs out (30 days before its end when it has no notice), or soon when that is
    # already past and its end isn't; moved with the dates, and cancelled when it is no longer a contract or has no
    # end. Save contract-reminder first: this one names it.
    name: Contract watch
    description: Schedules a reminder before a contract's notice runs out.
    trigger: { on: entity.changed, type: Paper }
    steps:
      - id: open
        type: data.map
        with:
          from: "{{trigger.item}}"
          expression: |-
            (
              $t := $toMillis($now());
              $end := endsOn ? $toMillis(endsOn) + 24 * 60 * 60 * 1000;
              $ahead := noticeDays ? noticeDays + 14 : 30;
              $day := $end - ($ahead + 1) * 24 * 60 * 60 * 1000;
              $at := $day + 9 * 60 * 60 * 1000 > $t ? $fromMillis($day, "[Y0001]-[M01]-[D01]") & "T09:00" : $fromMillis($t + 10 * 60 * 1000);
              kind = "contract" and $end > $t ? { "remindAt": $at }
            )
      - id: later
        type: flow.later
        forEach: "{{open.items}}"
        with:
          pipeline: contract-reminder
          at: "{{item.remindAt}}"
          key: "contract:{{trigger.key}}"
          data: { paper: "{{trigger.item}}" }
      - id: closed
        type: data.map
        with:
          from: "{{trigger.item}}"
          expression: '$not(kind = "contract" and $exists(endsOn)) ? { "id": id }'
      - id: stop
        type: flow.cancel
        forEach: "{{closed.items}}"
        with: { key: "contract:{{trigger.key}}" }

  contract-reminder:
    # Started by contract-watch before a contract's notice runs out: when it ends and the last day to cancel it, on
    # Telegram. Renew it, change it, or press Cancel contract on its page.
    name: Contract reminder
    description: Tells you a contract ends soon, and the last day to cancel it.
    trigger: { on: flow.later }
    steps:
      - id: text
        type: data.map
        with:
          from: "{{trigger.data.paper}}"
          expression: |-
            (
              $last := noticeDays ? $fromMillis($toMillis(endsOn) - noticeDays * 24 * 60 * 60 * 1000, "[Y0001]-[M01]-[D01]");
              "Contract ending: " & title & (merchant ? " (" & merchant & ")" : "") & " ends on " & endsOn & "."
                & ($last ? " To cancel it, tell them by " & $last & "." : "")
                & " Keep it, change it, or press Cancel contract on its page."
            )
      - id: tell
        type: notify.telegram
        with: { text: "{{text.value}}" }

  expense-report:
    # On the 1st of every month, and from the Papers list's button: last month's receipts and invoices (not the ones
    # in the personal category) and, with a Bills App, last month's bills, listed for you to untick what isn't an
    # expense, then one email with each of them and the totals per currency to your accountant (a setting), after you
    # Act, with the papers' documents attached (at most 20 and 18 MB together: more stops the run before the gate, and
    # says so).
    name: Expense report
    description: Last month's receipts and invoices to your accountant, the ones you pick, after you approve it.
    trigger: { schedule: "0 8 1 * *" }
    needs:
      accountant: { kind: text, label: "Your accountant's email address", example: accountant@example.com }
    limits:
      email.send: 3/day
    steps:
      - id: month
        type: data.map
        with:
          from: { at: now }
          # Last month: its first day, the first day of this one, and its name.
          expression: |-
            (
              $this := $substring($string($now()), 0, 7) & "-01";
              $last := $fromMillis($toMillis($this) - 24 * 60 * 60 * 1000, "[Y0001]-[M01]") & "-01";
              { "from": $last, "to": $this, "label": $fromMillis($toMillis($last), "[MNn] [Y0001]") }
            )
      - id: papers
        type: data.read
        with:
          type: Paper
          where:
            - { field: kind, op: in, value: [receipt, invoice] }
            - { field: date, op: gte, value: "{{month.value.from}}" }
            - { field: date, op: lt, value: "{{month.value.to}}" }
          sort: date
          limit: 500
      # M66: last month's bills from your Bills App (none without one), as the papers are listed.
      - id: bills
        type: data.read
        with:
          type: Bill
          where:
            - { field: month, op: gte, value: "{{month.value.from}}" }
            - { field: month, op: lt, value: "{{month.value.to}}" }
          limit: 200
      - id: business
        type: data.map
        with:
          from: { papers: "{{papers.items}}", bills: "{{bills.items}}" }
          expression: |-
            [$append(
              papers[$not(category = "personal")],
              bills.{ "title": issuer, "merchant": issuer, "kind": "bill", "category": "bill", "amount": amount,
                      "currency": currency, "date": dueDate ? dueDate : month }
            )^(date)]
      - id: pick
        type: gate.review
        when: "{{business.items}}"
        with: { items: "{{business.items}}", title: "Expenses for {{month.value.label}}: untick what isn't one" }
      - id: report
        type: data.map
        with:
          from: { papers: "{{pick.selected}}", month: "{{month.value.label}}" }
          # One line a paper, then the totals per currency.
          expression: |-
            (
              $ps := [papers];
              $line := function($p) {
                $p.date & "  " & ($p.merchant ? $p.merchant : $p.title) & "  " & ($p.category ? $p.category : "other") & "  "
                  & ($exists($p.amount) ? $formatNumber($p.amount, "#,##0.00") & " " & $p.currency : "no amount")
              };
              $sums := $ps[$exists(amount) and $exists(currency)]{ currency: $sum(amount) };
              $count($ps) > 0 ? "Hello,\n\nMy expenses for " & month & ", " & $count($ps) & " in all:\n\n"
                & $join($map($ps, $line), "\n")
                & ($sums ? "\n\nTotal: " & $join($each($sums, function($v, $k) { $formatNumber($v, "#,##0.00") & " " & $k }), ", ") : "")
                & "\n\nThe documents are attached. Tell me if you need anything else.\n"
            )
      # M59-T1: the papers' documents, the ones without one left out.
      - id: documents
        type: data.map
        with:
          from: { papers: "{{pick.selected}}" }
          expression: "[papers.document]"
      - id: send
        type: email.send
        when: "{{report.value}}"
        with:
          to: "{{setting.accountant}}"
          subject: "Expenses for {{month.value.label}}"
          body: "{{report.value}}"
          attachments: "{{documents.items}}"
