# M40: the starter example. An App that needs nothing set up: what it keeps comes from public release feeds (no account,
# no LLM, no messages). A Release starts as new; mark it read or skipped on its row, or open it for its page.
app:
  name: Releases to read
  description: New releases of a few open-source projects, kept until you have read them
  icon: package
  summary: >-
    New releases of a few open-source projects, each kept until you mark it read. Needs nothing set up.
  starter: true
  setup: []
types:
  Release:
    key: id
    title: title
    stages:
      field: status
      initial: new
      states: [new, read, skipped]
      moves:
        - { from: new, to: [read, skipped] }
        - { from: [read, skipped], to: [new] }   # a mistake undone
    fields:
      id: { type: text, required: true }
      title: { type: text, required: true }
      published: { type: datetime }
      url: { type: url }
      source: { type: url, label: Project }
      note: { type: longtext, mine: true }
pages:
  - list: Release
    menu: { label: Releases to read, icon: package }
    columns: [title, published, status]
    filters: [status]
    sort: -published
    moves: true
    actions:
      - { label: Check now, run: releases-to-read }
  - view: Release
    fields: [title, published, url, source]

pipelines:
  releases-to-read:
    # M40: the starter example's pipeline. Once a day, the newest releases of a few projects from their feeds (no browser,
    # no recipe, no LLM), kept as Releases to read: a release seen before is left as it is, so the stage you gave it stays.
    # Add or remove projects in `urls` (GitHub: https://github.com/<owner>/<repo>/releases.atom).
    fullName: Read release feeds
    description: Once a day, the newest releases of a few projects, kept to read.
    trigger: { schedule: "0 9 * * *" }
    policy:
      allowedDomains: [github.com]
    steps:
      - id: feeds
        type: http.fetch
        with:
          urls:
            - https://github.com/nodejs/node/releases.atom
            - https://github.com/microsoft/vscode/releases.atom
            - https://github.com/prisma/prisma/releases.atom
          maxItems: 30
      - id: keep
        type: data.save
        with: { items: "{{feeds.items}}", type: Release, fields: [title] }
