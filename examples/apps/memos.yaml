# M48: the Memos App: notes to keep, each with a photo if you like, added on its list, newest first and searchable.
# A memo's key is made by Storm, so its title can change. No pipeline: you write them (and, later, from Telegram).
app:
  name: Memos
  description: Notes to keep, with a photo if you like, newest first
  icon: bookmark
  summary: >-
    Notes to keep, each with a photo and tags if you like, newest first and searchable, by tag or by the day on a
    calendar; added on its list, or with /memo on Telegram (#words are its tags; a photo with /memo as its caption).
  setup:
    - { kind: telegram, label: "Telegram, for /memo (the page works without it)" }
types:
  Memo:
    key: id
    title: title
    fields:
      id: { type: text, auto: true }
      title: { type: text, required: true }
      text: { type: longtext }
      photo: { type: image }
      # M65: tags, typed one per line on the form or as #words on Telegram; matched without case.
      tags: { type: list, of: text }
pages:
  - list: Memo
    menu: { label: Memos, icon: bookmark }
    add: true
    columns: [photo, title, { field: tags, control: chips }, "@firstSeen"]
    # The tags in use with their counts, and the days memos were kept on, for the calendar beside the list.
    sources:
      tags: { from: Memo, distinct: tags }
      days: { from: Memo, distinct: "@firstSeen", by: day }
    controls:
      - { control: chips, source: tags, filters: tags, multiple: true }
      - { control: calendar, source: days, filters: "@firstSeen" }
    search: [title, text, tags]
    sort: -@firstSeen
  - view: Memo
    fields: [title, text, photo, tags]
  - form: Memo
    fields: [title, text, photo, tags]

pipelines:
  memo-from-telegram:
    # /memo on the Storm bot keeps a memo in the Memos App: the text after it,
    # its first line as the title; a photo sent with /memo as its caption is kept with it. Switch it on to have /memo in
    # the bot's menu. No LLM.
    name: From Telegram
    description: /memo on Telegram keeps a memo, with a photo sent with it.
    trigger: { on: telegram.command, command: memo, description: "Keep a note: /memo text #tag, or a photo with /memo as its caption" }
    steps:
      - id: photo
        type: file.keep
        with: { type: Memo, field: photo, telegram: "{{trigger.file}}" }
      - id: memo
        type: data.map
        with:
          from: { text: "{{trigger.text}}", sentAt: "{{trigger.sentAt}}", photo: "{{photo.first}}" }
          # The first line is its title, without its #tags (all tags: as written); a photo alone is named by its day.
          # Every #word is a tag.
          expression: |-
            (
              $tag := /#([^\s#.,;:!?()]+)/;
              $tags := [$match(text, $tag).groups[0]];
              $line := $trim($split(text, "\n")[0]);
              $bare := $trim($replace($replace($line, /#[^\s#.,;:!?()]+[.,;:!?]*/, ""), /\s+/, " "));
              $first := $bare ? $bare : $line;
              $first or photo ? {
                "title": $first ? $substring($first, 0, 80) : "Photo of " & $substring(sentAt, 0, 10),
                "text": text ? text : undefined,
                "photo": photo,
                "tags": $count($tags) > 0 ? $tags : undefined
              }
            )
      - id: save
        type: data.save
        with: { type: Memo, items: "{{memo.items}}" }
      - id: kept
        type: notify.telegram
        when: "{{save.added}}"
        with: { text: "Kept: {{memo.value.title}}" }
