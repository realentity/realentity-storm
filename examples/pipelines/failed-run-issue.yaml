# M29: when Release watch fails, a GitHub issue proposed in your repository, with what went wrong; created only when
# you press Act at its gate. Another pipeline: its name in `pipeline`. You choose its GitHub credential (a fine-grained
# token with Issues: read and write on the repository, kind API key, allowed host api.github.com) and type the
# repository on its page.
name: Failed run issue
description: A GitHub issue, after you approve it, when Release watch fails.
needs:
  github: { kind: credential, type: api_key, for: api.github.com, label: "GitHub, to open issues" }
  repository: { kind: text, label: "Repository (owner/name)", example: me/infra }
trigger: { on: run.finished, pipeline: Release watch, status: [FAILED] }
steps:
  - id: issue
    type: http.request
    with:
      method: POST
      url: "https://api.github.com/repos/{{setting.repository}}/issues"
      headers:
        Authorization: "Bearer {{cred:github}}"
        Accept: application/vnd.github+json
      body:
        title: "Storm: {{trigger.pipeline}} failed"
        body: "{{trigger.summary}}\n\nRun {{trigger.runId}}"
        labels: [storm]
