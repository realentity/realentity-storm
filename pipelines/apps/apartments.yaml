# The Apartments App, for finding a place to rent: what you're looking for (Search, mine), the listings a site's recipe
# finds (listings.yaml), each marked by how well it fits and with its price history, and where you are with each, from
# new to favorite, contacted, viewing and offer. A favorite's button asks its agent for a viewing (ask-for-viewing.yaml),
# by email to an Agent you added, never to an address a page gave; the viewing time you set goes into your calendar
# (viewing.yaml); the list's button compares your favorites (compare-favorites.yaml). Save it on the Apps page before
# its pipelines.
name: Apartments
description: Listings that fit what you look for, and viewings
icon: home
types:
  Search:
    mine: true                     # what you look for: the listings are marked against it
    key: name
    fields:
      name: { type: text, required: true }
      areas: { type: list }        # districts or streets you want
      maxPrice: { type: money, currency: currency, label: Up to }
      currency: { type: text }
      minRooms: { type: number, label: Rooms }
      mustHave: { type: longtext, label: Must have }  # a balcony, pets allowed, near a metro
      enabled: { type: yesno, label: Looking }
  Agent:
    mine: true                     # agents and owners you write to: their address is the only one Storm writes to
    key: name
    fields:
      name: { type: text, required: true }
      email: { type: email, required: true }
      agency: { type: text }
      phone: { type: text }
      notes: { type: longtext }    # when you can see a place: the request for a viewing offers it
  Listing:
    key: url
    title: title
    stages:
      field: status
      initial: new
      states: [new, favorite, contacted, viewing, offer, rejected]
      moves:
        - { from: new, to: [rejected], by: [me, pipeline] }            # one that doesn't fit starts rejected
        - { from: [new, rejected], to: [favorite] }
        - { from: favorite, to: [contacted], by: [me, pipeline] }      # once the request for a viewing is sent
        - { from: [new, favorite, contacted], to: [viewing], by: [me, pipeline] }   # once a viewing time is set
        - { from: viewing, to: [offer] }
        - { from: [favorite, contacted, viewing, offer], to: [rejected] }
        - { from: rejected, to: [new] }
    fields:
      url: { type: url, required: true }
      title: { type: text, required: true }
      price: { type: money, currency: currency }
      currency: { type: text }
      area: { type: text }
      rooms: { type: number }
      size: { type: number, label: m² }
      floor: { type: text }
      agency: { type: text }
      source: { type: text }
      fit: { type: enum, values: [match, maybe, no] }
      fitReason: { type: longtext, label: Why }
      agent: { type: text, mine: true }            # the Agent's name: a request for a viewing goes to their address
      viewingAt: { type: datetime, mine: true, label: Viewing }
      notes: { type: longtext, mine: true }
pages:
  - list: Listing
    menu: { label: Apartments, icon: home }
    columns: [title, price, area, rooms, size, fit, status]
    filters: [status, fit]
    sort: price
    group: { by: status }
    moves: true
    actions:
      - { label: Check now, run: Listings }
      - { label: Compare favorites, run: Compare favorites }
  - view: Listing
    sections:
      - { title: Listing, fields: [title, price, area, rooms, size, floor, agency, url] }
      - { title: Fit, fields: [fit, fitReason] }
    history: { collection: listing-prices, label: Price, stepped: true }
    actions:
      - { label: Ask for a viewing, run: Ask for a viewing, when: { status: favorite }, confirm: "Draft a request for a viewing to this listing's agent? You see it before it goes." }
  - form: Listing
    fields: [agent, viewingAt, notes]
  - list: Search
    menu: { label: What I look for, icon: star }
    columns: [name, areas, maxPrice, minRooms, enabled]
  - list: Agent
    menu: { label: Agents, icon: bookmark }
    columns: [name, agency, email, phone]
    sort: name
