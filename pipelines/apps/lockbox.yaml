# Lockbox: your projects' GitHub variables and secrets, kept here and sent to GitHub when you press Sync. One flat list
# of entries: each a variable or a secret (encrypted, never shown again), for a project, a path and an environment. A
# bundle names where they go (a repository, one of its environments, an organisation, Dependabot) and which paths, in
# order: a later path's value of a name wins, so /_backend's shared values can be overridden by /backend-api's own.
# Sync (lockbox-sync.yaml) adds and updates; it never deletes in GitHub. Save it on the Apps page before its pipeline.
name: Lockbox
description: GitHub variables and secrets, kept here and synced when you press Sync
icon: lock
# Chosen when you install it; `help` says how to make the token, under the slot and on the form that adds it.
needs:
  github:
    kind: credential
    type: api_key
    for: api.github.com
    label: "GitHub, to write variables and secrets"
    help: |-
      A fine-grained personal access token (GitHub: Settings, Developer settings, Personal access tokens, Fine-grained tokens).
      Repository access: only the repositories your bundles send to.
      Repository permissions, Read and write: Secrets and Variables; Environments too for an environment's; Dependabot secrets for Dependabot.
      For an organisation's: its owner as the token's Resource owner, and Organization permissions Secrets and Variables, Read and write (an organisation may have to approve the token).
      Metadata: Read is added by GitHub.
types:
  Project:
    mine: true
    key: name
    fields:
      name: { type: text, required: true }
      description: { type: longtext }
  # A variable or a secret of a project: its value in `value` (a variable's, shown) or `secret` (encrypted). Your own
  # environments: edit the values here and in Bundle.
  Entry:
    mine: true
    key: id
    title: name
    fields:
      id: { type: text, auto: true }
      name: { type: text, required: true, help: "As GitHub will have it, e.g. DATABASE_URL" }
      kind: { type: enum, values: [variable, secret], required: true }
      project: { type: ref, to: Project, required: true }
      path: { type: text, required: true, help: "Where in the project, e.g. /backend-api; /_backend for values several share" }
      environment: { type: enum, values: [production, staging, development], required: true }
      value: { type: longtext, help: "A variable's value" }
      secret: { type: longtext, encrypted: true, help: "A secret's value: encrypted, never shown again" }
  # Where a project's entries of one environment go, and which paths, in order: a later path's value of a name wins.
  Bundle:
    mine: true
    key: name
    fields:
      name: { type: text, required: true }
      project: { type: ref, to: Project, required: true }
      environment: { type: enum, values: [production, staging, development], required: true }
      paths: { type: list, required: true, help: "One per line, in order: a later path's value of a name wins, e.g. /_deploy, /_backend, /backend-api" }
      destination:
        type: enum
        values: [repository, environment, organization, dependabot]
        required: true
        help: "A repository's secrets and variables, one of its environments', an organization's, or Dependabot's (secrets only)"
      owner: { type: text, required: true, help: "The user or organization on GitHub, e.g. acme" }
      repository: { type: text, help: "The repository's name, e.g. api (not for an organization)" }
      githubEnvironment: { type: text, label: GitHub environment, help: "The repository's environment, e.g. production (only for environment)" }
      visibility:
        type: enum
        values: [all, private]
        help: "Only for an organization: which of its repositories may use them, all or the private and internal ones"
pages:
  - list: Project
    menu: { label: Projects, icon: lock }
    add: true
    columns: [name, description]
  - view: Project
    fields: [description]
    related:
      - { type: Entry, by: project, label: Variables and secrets, columns: [name, kind, path, environment], filters: [kind, environment], add: true }
      - { type: Bundle, by: project, label: Bundles, columns: [name, environment, destination, owner, repository], add: true }
  - list: Entry
    menu: { label: Entries, icon: lock }
    add: true
    columns: [name, kind, path, environment, project]
    filters: [project, kind, environment]
    search: [name, path]
    sort: name
  - form: Entry
    fields: [name, kind, project, path, environment, value, secret]
  - list: Bundle
    menu: { label: Bundles, icon: lock }
    add: true
    columns: [name, project, environment, destination]
    filters: [project, environment]
  - view: Bundle
    fields: [project, environment, paths, destination, owner, repository, githubEnvironment, visibility]
    actions:
      - { label: Sync, run: Lockbox sync, confirm: "Send this bundle's variables and secrets to GitHub?" }
  - form: Bundle
    fields: [project, environment, paths, destination, owner, repository, githubEnvironment, visibility]
