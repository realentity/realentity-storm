# M22: your emails nobody answered in 5 days get a short follow-up in the same thread, drafted for your approval.
# Rejecting one leaves that thread alone; writing in it again makes it count again. Gmail: sentMailbox is found
# by itself ([Gmail]/Sent Mail).
name: Email follow-ups
description: A follow-up for your emails that got no answer in 5 days.
trigger: { schedule: "0 9 * * 1-5", tz: Europe/Sofia }
steps:
  - id: waiting
    type: email.awaiting
    with: { afterDays: 5, lookbackDays: 30, limit: 5 }
  - id: draft
    type: email.draftFollowUp
    forEach: "{{waiting.threads}}"
    with:
      message: "{{item.message}}"
      daysWaiting: "{{item.daysWaiting}}"
      instruction: A short, friendly nudge in two or three sentences.
  - id: send
    type: email.send
    forEach: "{{waiting.threads}}"
    with:
      to: "{{item.to}}"
      subject: "{{draft.subject}}"
      body: "{{draft.body}}"
      inReplyTo: "{{item.message.messageId}}"
      references: "{{item.references}}"
limits: { email.send: 10/day }
