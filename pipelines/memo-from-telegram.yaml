# /memo on the Storm bot keeps a memo in the Memos App (pipelines/apps/memos.yaml: save it first): the text after it,
# its first line as the title; a photo sent with /memo as its caption is kept with it. Switch it on to have /memo in
# the bot's menu. No LLM.
name: Memo from Telegram
app: Memos
description: /memo on Telegram keeps a memo, with a photo sent with it.
trigger: { on: telegram.command, command: memo, description: "Keep a note: /memo text, or a photo with /memo as its caption" }
steps:
  - id: photo
    type: file.keep
    with: { type: Memo, field: photo, telegram: "{{trigger.file}}" }
  - id: memo
    type: data.map
    with:
      from: { text: "{{trigger.text}}", sentAt: "{{trigger.sentAt}}", photo: "{{photo.first}}" }
      # The first line is its title; a photo alone is named by its day.
      expression: |-
        (
          $first := $trim($split(text, "\n")[0]);
          $first or photo ? {
            "title": $first ? $substring($first, 0, 80) : "Photo of " & $substring(sentAt, 0, 10),
            "text": text ? text : undefined,
            "photo": photo
          }
        )
  - id: save
    type: data.save
    with: { type: Memo, items: "{{memo.items}}" }
  - id: kept
    type: notify.telegram
    when: "{{save.added}}"
    with: { text: "Kept: {{memo.value.title}}" }
