# M27, M33: from a Release's button in the Releases App (pipelines/apps/releases.yaml): what upgrading to that release
# means, on Telegram. The Release is {{trigger.item}}: what the feed said, so it is summarized, never followed.
name: Release notes
app: Releases
description: Upgrade notes for one release, from its button on its page.
trigger: { on: entity.action, type: Release }
steps:
  - id: notes
    type: llm.summarize
    with:
      content: "{{trigger.item}}"
      instruction: >-
        What upgrading a self-hosted server to this release means: security fixes, breaking changes, required
        migrations, in that order. Say plainly when the notes don't tell.
      maxWords: 200
  - id: tell
    type: notify.telegram
    with: { text: "{{trigger.item.title}}\n{{notes.summary}}" }
