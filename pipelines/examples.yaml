# M40: the examples offered on the Apps page. Each is an App with the pipelines that fill it, installed together (as
# an import of one file: M35-T5), its pipelines off until you switch them on. `needs`: what has to be set up before its
# pipelines can run, shown on its card and ticked on its checklist:
#   email            an email account: IMAP_HOST on the server and the mail credential (Credentials)
#   google-calendar  Google Calendar connected (Settings)
#   telegram         the Telegram bot (TELEGRAM_BOT_TOKEN on the server)
#   llm              the LLM (ANTHROPIC_API_KEY on the server)
#   credential       a credential of that `name` (Credentials)
#   recipe           a site recipe of that `name` (Recipes, Teach)
#   entities         entities of that `type` you add on the App's page
# `files` are relative to pipelines/: the App first, then its pipelines.
examples:
  - id: releases-to-read
    name: Releases to read
    starter: true
    description: New releases of a few open-source projects, each kept until you mark it read. Needs nothing set up.
    needs: []
    files: [examples/releases-to-read-app.yaml, examples/releases-to-read.yaml]

  - id: releases
    name: Releases
    description: The releases of what runs on your server, summarized for upgrading, with upgrade notes on a button.
    needs:
      - { kind: llm, label: "The LLM, to summarize" }
      - { kind: telegram, label: "Telegram, for the summaries" }
    files: [apps/releases.yaml, release-watch.yaml, release-notes.yaml]

  - id: bills
    name: Bills
    description: Bills read from your email, by month, due until you mark them paid, with a reminder in your calendar.
    needs:
      - { kind: email, label: "An email account, to read the bills from" }
      - { kind: llm, label: "The LLM, to read each bill" }
      - { kind: google-calendar, label: "Google Calendar, for the reminders" }
      - { kind: telegram, label: "Telegram, to tell you about new bills" }
    files: [apps/bills.yaml, bills.yaml]

  - id: prices
    name: Prices
    description: The products you watch across shops, their price history, and a message when one drops below your target.
    needs:
      - { kind: entities, type: Product, label: "The products to watch, added on its page" }
      - { kind: telegram, label: "Telegram, to tell you about drops" }
    files: [apps/prices.yaml, prices.yaml]

  - id: trips
    name: Trips
    description: >-
      Bookings read from your email and matched to the trips you add, each in your calendar with a reminder the day
      before, a briefing with the weather three days before a trip, and a packing list on a button.
    needs:
      - { kind: entities, type: Trip, label: "Your trips, added on its page" }
      - { kind: email, label: "An email account, to read the bookings from" }
      - { kind: llm, label: "The LLM, to read each booking" }
      - { kind: google-calendar, label: "Google Calendar, for the bookings" }
      - { kind: telegram, label: "Telegram, for the reminders and briefings" }
    files:
      - apps/trips.yaml
      - trip-booking-reminder.yaml
      - trip-booking-reminders.yaml
      - trip-briefing.yaml
      - trip-countdown.yaml
      - trip-bookings.yaml
      - packing-list.yaml

  - id: clients
    name: Clients
    description: >-
      For freelance work: inquiries from email become scored leads, a proposal and a payment reminder on a button,
      sent only to clients you added, and an invoice draft for each lead you win, watched until it is paid.
    needs:
      - { kind: entities, type: Client, label: "Your clients, added on its page" }
      - { kind: email, label: "An email account, to read inquiries and send proposals" }
      - { kind: llm, label: "The LLM, to read inquiries and draft emails" }
      - { kind: telegram, label: "Telegram, for new leads and overdue invoices" }
    files:
      - apps/clients.yaml
      - client-inquiries.yaml
      - proposal.yaml
      - lead-won.yaml
      - overdue-invoices.yaml
      - payment-reminder.yaml

  - id: apartments
    name: Apartments
    description: >-
      Listings to rent from a site you choose, marked against what you look for, with their price history; a request
      for a viewing to an agent you added, the viewing in your calendar, and your favorites compared.
    needs:
      - { kind: recipe, name: listings.example/rent, label: "A listing site's recipe, listings.example/rent (Recipes: import or teach)" }
      - { kind: entities, type: Search, label: "What you look for, added on its page" }
      - { kind: llm, label: "The LLM, to mark and compare listings" }
      - { kind: telegram, label: "Telegram, for new matches and price drops" }
      - { kind: email, label: "An email account, to ask agents for viewings" }
      - { kind: google-calendar, label: "Google Calendar, for the viewings" }
    files:
      - apps/apartments.yaml
      - listings.yaml
      - ask-for-viewing.yaml
      - viewing.yaml
      - compare-favorites.yaml

  - id: orders
    name: Orders
    description: >-
      Online orders from the shops' emails, each email adding to its order as it ships and arrives; a reminder before
      the return window closes, unless you keep it, and a return request on a button.
    needs:
      - { kind: email, label: "An email account, to read the shops' emails from" }
      - { kind: llm, label: "The LLM, to read each email" }
      - { kind: telegram, label: "Telegram, for the orders and return reminders" }
    files:
      - apps/orders.yaml
      - orders.yaml
      - return-reminder.yaml
      - return-window.yaml
      - return-request.yaml

  - id: subscriptions
    name: Subscriptions
    description: >-
      What you pay for every month or year, from the services' emails, with what it costs a month and its price
      history; a reminder before a trial ends or a yearly renewal, a monthly review, and how to cancel on a button.
    needs:
      - { kind: email, label: "An email account, to read the services' emails from" }
      - { kind: llm, label: "The LLM, to read each email and review them" }
      - { kind: telegram, label: "Telegram, for the reminders and the review" }
    files:
      - apps/subscriptions.yaml
      - subscriptions.yaml
      - renewal-reminder.yaml
      - renewal-watch.yaml
      - subscription-review.yaml
      - cancel-subscription.yaml

  - id: car
    name: Car
    description: >-
      Your car's insurance, inspection, vignette, tax and services, added by you, with what runs out soon on the list,
      a message a month and a week before (or 1 000 km before a service), and each date in your calendar. No LLM.
    needs:
      - { kind: entities, type: Paper, label: "Your car's papers, added on its page" }
      - { kind: telegram, label: "Telegram, to tell you what runs out" }
      - { kind: google-calendar, label: "Google Calendar, for the dates" }
    files: [apps/car.yaml, car-papers-due.yaml, paper-in-calendar.yaml]

  - id: tables
    name: Tables
    description: Your database's tables and how they grow, counted every hour, with an alert when one grows too fast.
    needs:
      - { kind: credential, name: app-db, label: "A database credential named app-db (read-only)" }
      - { kind: telegram, label: "Telegram, for the alerts" }
    files: [apps/tables.yaml, table-growth.yaml]

  - id: server-ops
    name: Server ops
    description: >-
      Incidents on what you run: a monitor down (by webhook), a database check above 0, the database out of reach;
      each resolved by itself when the cause is gone, a GitHub issue on a button after you approve it, and the week in
      numbers. No LLM.
    needs:
      - { kind: credential, name: app-db, label: "A database credential named app-db (read-only), and your checks in Database check" }
      - { kind: telegram, label: "Telegram, for the incidents" }
      - { kind: credential, name: github, label: "A GitHub credential named github, for Open issue (and your repository in Incident issue)" }
    files:
      - apps/server-ops.yaml
      - monitor-alerts.yaml
      - database-check.yaml
      - database-down.yaml
      - incident-issue.yaml
      - ops-week.yaml
