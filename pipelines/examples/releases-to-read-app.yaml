# M40: the starter example. An App that needs nothing set up: what it keeps comes from public release feeds (no account,
# no LLM, no messages). A Release starts as new; mark it read or skipped on its row, or open it for its page.
name: Releases to read
description: New releases of a few open-source projects, kept until I have read them
icon: package
types:
  Release:
    key: id
    title: title
    stages:
      field: status
      initial: new
      states: [new, read, skipped]
      moves:
        - { from: new, to: [read, skipped] }
        - { from: [read, skipped], to: [new] }   # a mistake undone
    fields:
      id: { type: text, required: true }
      title: { type: text, required: true }
      published: { type: datetime }
      url: { type: url }
      source: { type: url, label: Project }
      note: { type: longtext, mine: true }
pages:
  - list: Release
    menu: { label: Releases to read, icon: package }
    columns: [title, published, status]
    filters: [status]
    sort: -published
    moves: true
    actions:
      - { label: Check now, run: Read release feeds }
  - view: Release
    fields: [title, published, url, source]
