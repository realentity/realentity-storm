# Development: PostgreSQL with pgvector only (docs/design.md §15). The full stack is docker/compose.yml (docs/self-hosting.md).
# Not needed if you already run PostgreSQL 17 with pgvector locally; point DATABASE_URL there instead.
name: realentity-storm

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: aime
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aime}
      POSTGRES_DB: aime
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aime"]
      interval: 5s
      retries: 10

volumes:
  # Named as before the rename (project ai-me), so an existing development database is kept.
  pgdata:
    name: ai-me_pgdata
