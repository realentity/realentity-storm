# AI ME on the server (app 10; docs/deployment.md). Lives in /opt/ai-me (a clone of this repository); secrets in
# /opt/ai-me/.env. The database is the server's native PostgreSQL (storm), which the server's nightly backup dumps.
# Only the web container publishes ports, on 127.0.0.1: 7100, which `tailscale serve` publishes as :8100 (tailnet only),
# and 7101, the hooks-only site, as :8101 (for the VPS's hooks-gateway).
name: ai-me

x-node: &node
  env_file: ${AIME_ENV_FILE:-../.env}
  environment:
    NODE_ENV: production
    TZ: Europe/Sofia
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # Migrations and the seed, before api and worker start (the extensions are enabled once by postgres: see the guide).
  migrate:
    <<: *node
    build: { context: .., dockerfile: docker/Dockerfile, target: migrate }
    image: ai-me/migrate:local
    restart: "no"
    read_only: false
    mem_limit: 768m

  api:
    <<: *node
    build: { context: .., dockerfile: docker/Dockerfile, target: api }
    image: ai-me/api:local
    environment:
      NODE_ENV: production
      TZ: Europe/Sofia
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      ARTIFACTS_DIR: /data/artifacts
      DOCUMENTS_DIR: /data/documents
    depends_on:
      migrate: { condition: service_completed_successfully }
    # On the server's secondary disk (static files of apps, like Paperless and Memos). Long form on purpose: a missing disk
    # stops the container instead of files landing on the main disk.
    volumes:
      # Screenshots, traces and downloads the worker stored: the api only reads them, to serve them to me.
      - type: bind
        source: ${AIME_ARTIFACTS:-/data/ai-me/artifacts}
        target: /data/artifacts
        read_only: true
        bind: { create_host_path: false }
      # My documents (CV, cover letters): uploaded through the api, read by the worker to attach as approved.
      - type: bind
        source: ${AIME_DOCUMENTS:-/data/ai-me/documents}
        target: /data/documents
        bind: { create_host_path: false }
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 512m
    pids_limit: 128

  worker:
    <<: *node
    build: { context: .., dockerfile: docker/Dockerfile, target: worker }
    image: ai-me/worker:local
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      TZ: Europe/Sofia
      ARTIFACTS_DIR: /data/artifacts
      DOCUMENTS_DIR: /data/documents
    volumes:
      # Files the pipelines produce (screenshots, traces, downloads), deleted after ARTIFACTS_RETENTION_DAYS; working
      # files, not backed up (the runs themselves are in the database).
      - type: bind
        source: ${AIME_ARTIFACTS:-/data/ai-me/artifacts}
        target: /data/artifacts
        bind: { create_host_path: false }
      # My documents: only read here (the api writes them); attached to forms only as approved, checked by SHA-256.
      - type: bind
        source: ${AIME_DOCUMENTS:-/data/ai-me/documents}
        target: /data/documents
        read_only: true
        bind: { create_host_path: false }
    # The browser stack (README §6): Chromium needs a large /dev/shm; tini reaps Chromium's and Xvfb's processes.
    # Port 6080 (websockify, the live view) is reachable only on the compose network, through Caddy's /vnc.
    shm_size: 1gb
    init: true
    # Unhealthy when its heartbeat file is older than 2 minutes (it beats every 30 s); the api alerts on Telegram.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s = require('fs').statSync(require('os').tmpdir() + '/aime-worker.alive'); process.exit(Date.now() - s.mtimeMs < 120000 ? 0 : 1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    # Time for the queue to hand back its jobs on stop; an interrupted step runs again on start (README §2.6).
    stop_grace_period: 60s
    mem_limit: 2g
    pids_limit: 512

  web:
    build: { context: .., dockerfile: docker/Dockerfile, target: web }
    image: ai-me/web:local
    ports:
      - "127.0.0.1:${AIME_PORT:-7100}:8080" # app 10 (the server's port convention: 7NNE local, 8NNE tailnet)
      # The hooks-only site (Caddyfile :8081): `tailscale serve --http=8101`, reachable by the VPS's hooks-gateway only.
      - "127.0.0.1:${AIME_HOOKS_PORT:-7101}:8081"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: [/data, /config]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
