# Storm in production (docs/self-hosting.md), always started through ./docker/storm, which also reads the repository's
# .env for the ${...} settings below. The database is a PostgreSQL of your own (DATABASE_URL), or compose.local.yml's.
# Only the web container publishes ports, on 127.0.0.1: STORM_PORT (7100), the app, and STORM_HOOKS_PORT (7101), the
# hooks-only site. Put HTTPS in front of the app yourself (tailscale serve, Caddy, ...); expose the hooks site to the
# Internet only if you use Telegram or webhooks (docs/self-hosting.md, "Webhooks and Telegram").
name: realentity-storm

x-node: &node
  env_file: ${STORM_ENV_FILE:-../.env}
  environment:
    NODE_ENV: production
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  # Migrations and the seed, before api and worker start (the extensions are enabled once by postgres: see the guide).
  migrate:
    <<: *node
    build: { context: .., dockerfile: docker/Dockerfile, target: migrate }
    image: realentity-storm/migrate:local
    restart: "no"
    read_only: false
    mem_limit: 768m

  api:
    <<: *node
    build: { context: .., dockerfile: docker/Dockerfile, target: api }
    image: realentity-storm/api:local
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      ARTIFACTS_DIR: /data/artifacts
      DOCUMENTS_DIR: /data/documents
    depends_on:
      migrate: { condition: service_completed_successfully }
    # Under STORM_DATA_DIR (default: the repository's data/ folder; create artifacts/ and documents/ in it, owned by uid
    # 1000). Long form on purpose: a missing folder (say, an unmounted disk) stops the container instead of files
    # landing somewhere else.
    volumes:
      # Screenshots, traces and downloads the worker stored: the api only reads them, to serve them to you.
      - type: bind
        source: ${STORM_DATA_DIR:-../data}/artifacts
        target: /data/artifacts
        read_only: true
        bind: { create_host_path: false }
      # Your documents (CV, cover letters): uploaded through the api, read by the worker to attach as approved.
      - type: bind
        source: ${STORM_DATA_DIR:-../data}/documents
        target: /data/documents
        bind: { create_host_path: false }
    healthcheck:
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 512m
    pids_limit: 128

  worker:
    <<: *node
    build: { context: .., dockerfile: docker/Dockerfile, target: worker }
    image: realentity-storm/worker:local
    depends_on:
      migrate: { condition: service_completed_successfully }
    environment:
      NODE_ENV: production
      ARTIFACTS_DIR: /data/artifacts
      DOCUMENTS_DIR: /data/documents
    volumes:
      # Files the pipelines produce (screenshots, traces, downloads), deleted after ARTIFACTS_RETENTION_DAYS; working
      # files, not backed up (the runs themselves are in the database).
      - type: bind
        source: ${STORM_DATA_DIR:-../data}/artifacts
        target: /data/artifacts
        bind: { create_host_path: false }
      # Your documents: only read here (the api writes them); attached to forms only as approved, checked by SHA-256.
      - type: bind
        source: ${STORM_DATA_DIR:-../data}/documents
        target: /data/documents
        read_only: true
        bind: { create_host_path: false }
    # The browser stack (docs/design.md §6): Chromium needs a large /dev/shm; tini reaps Chromium's and Xvfb's processes.
    # Port 6080 (websockify, the live view) is reachable only on the compose network, through Caddy's /vnc.
    shm_size: 1gb
    init: true
    # Unhealthy when its heartbeat file is older than 2 minutes (it beats every 30 s); the api alerts on Telegram.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const s = require('fs').statSync(require('os').tmpdir() + '/storm-worker.alive'); process.exit(Date.now() - s.mtimeMs < 120000 ? 0 : 1)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    # Time for the queue to hand back its jobs on stop; an interrupted step runs again on start (docs/design.md §2.6).
    stop_grace_period: 60s
    mem_limit: 2g
    pids_limit: 512

  web:
    build: { context: .., dockerfile: docker/Dockerfile, target: web }
    image: realentity-storm/web:local
    ports:
      - "127.0.0.1:${STORM_PORT:-7100}:8080" # the app
      # The hooks-only site (Caddyfile :8081): POST /hooks/* and nothing else, for whatever brings Telegram and webhooks in.
      - "127.0.0.1:${STORM_HOOKS_PORT:-7101}:8081"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: [/data, /config]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
