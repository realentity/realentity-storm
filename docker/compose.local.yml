# The production stack with a PostgreSQL container, for a host without PostgreSQL or a local test:
#   STORM_LOCAL=1 ./docker/storm up            (or STORM_ENV_FILE=<a test env> for a separate test setup)
# The env sets DATABASE_URL=postgresql://aime:aime@postgres:5432/aime and APP_ORIGIN=http://localhost:7100.
# Change the password for anything but a test.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: aime
      POSTGRES_PASSWORD: aime
      POSTGRES_DB: aime
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aime -d aime"]
      interval: 5s
      retries: 12

  migrate:
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata: {}
