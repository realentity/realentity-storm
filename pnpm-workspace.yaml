packages:
  - "apps/*"
  - "packages/*"

# One place for every version shared across the workspace.
# Versions pinned on purpose (same Prisma, NestJS, React, Vite, tooling).
catalog:
  # tooling
  typescript: ^5.7.3
  "@types/node": ^22.14.1
  prettier: ^3.4.2
  turbo: ^2.11.4
  tsx: ^4.19.3
  rimraf: ^6.0.1
  eslint: ^9.18.0
  "@eslint/js": ^9.24.0
  typescript-eslint: ^8.30.1
  globals: ^16.0.0
  eslint-config-prettier: ^10.0.1
  eslint-plugin-react-hooks: ^5.2.0
  eslint-plugin-react-refresh: ^0.4.19
  jest: ^29.7.0
  ts-jest: ^29.2.5
  "@types/jest": ^29.5.14
  supertest: ^7.1.0
  "@types/supertest": ^6.0.3
  dotenv: ^16.4.7
  zod: ^4.1.0
  yaml: ^2.6.1

  # nest
  "@nestjs/common": 11.2.7
  "@nestjs/core": 11.2.7
  "@nestjs/platform-express": 11.2.7
  "@nestjs/testing": 11.2.7
  "@nestjs/cli": ^11.0.0
  "@nestjs/schematics": ^11.0.0
  "@nestjs/throttler": ^6.4.0
  otplib: ^12.0.1
  qrcode: ^1.5.4
  "@types/qrcode": ^1.5.5
  testcontainers: ^11.5.1
  "@testcontainers/postgresql": ^11.5.1
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.1
  helmet: ^8.1.0
  cookie-parser: ^1.4.7
  "@types/cookie-parser": ^1.4.8
  "@types/express": ^5.0.0
  source-map-support: ^0.5.21

  # db
  prisma: 7.10.0
  "@prisma/client": 7.10.0
  "@prisma/adapter-pg": 7.10.0
  pg: ^8.13.1
  "@types/pg": ^8.11.10
  argon2: ^0.41.1

  # queue: pg-boss 11 is the last CommonJS major (12 is ESM-only; the Nest apps and Jest are CommonJS)
  pg-boss: 11.1.2
  cron-parser: ^5.4.0

  # events: the api forwards worker events to the web app over a WebSocket
  ws: ^8.18.0
  "@types/ws": ^8.5.13

  # mail: IMAP (imapflow), SMTP (nodemailer), MIME parsing (mailparser); each ships CommonJS and its own types
  imapflow: ^2.10.0
  nodemailer: ^10.3.0
  mailparser: ^3.14.0

  # llm
  "@anthropic-ai/sdk": ^1.3.0

  # web
  react: ^18.2.0
  react-dom: ^18.2.0
  "@types/react": ^18.2.42
  "@types/react-dom": ^18.2.17
  vite: ^6.3.1
  "@vitejs/plugin-react": ^4.3.4
  vitest: ^3.1.1
  react-router-dom: ^7.5.1
  react-toastify: ^10.0.5
  "@tabler/core": ^1.6.0
  "@tabler/icons-react": ^3.48.0
  # browser tests (apps/web-e2e)
  "@playwright/test": ^1.63.0
