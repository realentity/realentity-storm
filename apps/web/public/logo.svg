<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Eye of the storm, flat: the app's primary cyan as a solid tile, three white arms around a white eye -->
  <rect width="64" height="64" rx="14" fill="#0b7a94"/>
  <g transform="translate(32 32)" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round">
    <path d="M0 -6 C10 -9 18 -3 19 9"/>
    <path d="M0 -6 C10 -9 18 -3 19 9" transform="rotate(120)"/>
    <path d="M0 -6 C10 -9 18 -3 19 9" transform="rotate(240)"/>
  </g>
  <g transform="translate(32 32)" fill="#fff">
    <circle cx="19" cy="9" r="3.5"/>
    <circle cx="19" cy="9" r="3.5" transform="rotate(120)"/>
    <circle cx="19" cy="9" r="3.5" transform="rotate(240)"/>
    <circle r="3.5"/>
  </g>
</svg>
