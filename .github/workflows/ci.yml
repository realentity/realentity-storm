name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Secrets and commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The whole history every time (it is small): a secret is a problem in any commit, not only the new ones.
      # The same version as on the developers' machines: older ones don't read .gitleaks.toml's [[allowlists]].
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball" -O "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "$tarball" gitleaks
          ./gitleaks git --no-banner --redact --config .gitleaks.toml .

      # AI use is disclosed once, in the README; commits carry no attribution trailers (.githooks/commit-msg).
      - name: No AI attribution trailers
        run: |
          if git log --format='%H %B' | grep -iE 'co-authored-by:.*(claude|anthropic)|generated with \[?claude code|noreply@anthropic\.com|claude-session:'; then
            echo "::error::Commit messages above carry AI attribution trailers; reword them."
            exit 1
          fi

  verify:
    name: Build, lint, typecheck, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Turbo runs with --env-mode=loose so tasks see these values (prisma generate needs DATABASE_URL).
    env:
      # Placeholders: unit tests contact no service; integration tests start their own PostgreSQL (Testcontainers).
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build
        run: pnpm build --env-mode=loose

      - name: Lint
        run: pnpm lint --env-mode=loose

      - name: Typecheck
        run: pnpm typecheck --env-mode=loose

      - name: Unit tests
        run: pnpm test --env-mode=loose

      # The worker's integration tests drive a real Chromium (browser steps, the agent, recipes, forms).
      - name: Install Chromium for the worker
        run: pnpm --filter @realentity/storm-worker exec playwright install --with-deps chromium

      - name: Integration tests
        run: pnpm test:e2e --env-mode=loose

  browser:
    name: Browser tests (Playwright, composed stack)
    # docs/design.md test strategy: end-to-end web tests run on PRs to main.
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Install Chromium
        run: pnpm --filter @realentity/storm-web-e2e exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:web --env-mode=loose

      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web-e2e/playwright-report
          retention-days: 7
